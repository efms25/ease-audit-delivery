services:

  db: 
    image: postgres:latest
    container_name: postgress_poc
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ease_queue_db
      POSTGRES_USER: ease_queue_user
      POSTGRES_PASSWORD: ease_queue_pass
    ports:
      - "5432:5432"
    networks:
      - ease_network
      
  adminer:
    image: adminer
    container_name: adminer_poc
    restart: always
    ports:
      - 8085:8080
    networks:
      - ease_network
  redis:
    image: redis:8.10-alpine
    container_name: redis_poc
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ease_network

networks:
  ease_network:
    driver: bridge